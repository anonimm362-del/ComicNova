<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a10">
<title>Register • ComicNova</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="index.html" aria-label="ComicNova Home">
      <span class="brand-wordmark" aria-label="ComicNova"><span class="brand-comic">Comic</span><span class="brand-nova">Nova</span></span>
    </a>
    <form class="search" action="search.html">
      <input name="q" data-search placeholder="Cari judul manga, manhwa..." aria-label="Cari">
      <button type="submit" aria-label="Cari"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 5 5"></path></svg></button>
    </form>
    <a class="icon-btn" href="profile.html" aria-label="Profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </a>
  </div>
</header>
<main class="page"><div class="container">
<div class="form-wrap"><div class="panel auth-card">
  <div class="eyebrow">JOIN COMICNOVA</div><h1>Buat akun baru.</h1><p style="color:var(--muted)">Mulai menyimpan dan melanjutkan bacaanmu.</p>
  <button type="button" class="google-btn" id="googleLoginBtn"><svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.23c0-.78-.07-1.53-.22-2.23H12v4.22h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.92-4.18 2.92-7.35Z"/><path fill="#34A853" d="M12 21.7c2.63 0 4.84-.87 6.45-2.35l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.5A9.74 9.74 0 0 0 12 21.7Z"/><path fill="#FBBC05" d="M6.54 13.81A5.86 5.86 0 0 1 6.23 12c0-.63.11-1.24.31-1.81v-2.5H3.29A9.73 9.73 0 0 0 2.27 12c0 1.57.38 3.05 1.02 4.31l3.25-2.5Z"/><path fill="#EA4335" d="M12 6.16c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.18 14.63 2.3 12 2.3a9.74 9.74 0 0 0-8.71 5.39l3.25 2.5C7.31 7.88 9.46 6.16 12 6.16Z"/></svg><span>Lanjutkan dengan Google</span></button>
  <div class="auth-divider"><span>atau</span></div>
  <form id="registerForm">
    <div class="form-group"><label>Username</label><input name="username" required minlength="3" placeholder="Username"></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" required placeholder="nama@email.com"></div>
    <div class="form-row"><div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6"></div><div class="form-group"><label>Konfirmasi</label><input type="password" name="confirm" required minlength="6"></div></div>
    <button class="btn" style="width:100%">Create Account</button>
  </form>
  <div class="auth-links"><span>Sudah punya akun?</span><a href="login.html">Login</a></div>
</div></div>
</div></main>

<div class="toast"></div>
<script src="js/navigation.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body></html>
