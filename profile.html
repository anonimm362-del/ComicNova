<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a10">
<title>Profil • ComicNova</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="index.html" aria-label="ComicNova Home">
      <span class="brand-wordmark" aria-label="ComicNova"><span class="brand-comic">Comic</span><span class="brand-nova">Nova</span></span>
    </a>
    <form class="search" action="search.html">
      <input name="q" data-search placeholder="Cari judul manga, manhwa..." aria-label="Cari">
      <button type="submit" aria-label="Cari"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 5 5"></path></svg></button>
    </form>
    <a class="icon-btn" href="profile.html" aria-label="Profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </a>
  </div>
</header>
<main class="page"><div class="container">
<section class="page-head"><div class="eyebrow">ACCOUNT</div><h1>Profil</h1><p>Kelola profil dan aktivitas membaca.</p></section>
<div class="panel panel-pad">
  <div class="profile-head"><div class="avatar" id="profileAvatar">CN</div><div class="profile-meta"><h1 id="profileName">Guest Reader</h1><p id="profileEmail">Belum login</p></div></div>
  <div class="stat-grid" style="margin-top:22px"><div class="stat"><b id="bookmarkCount">0</b><span>Bookmark</span></div><div class="stat"><b id="historyCount">0</b><span>Riwayat</span></div><div class="stat"><b>0</b><span>Following</span></div><div class="stat"><b>0</b><span>Review</span></div></div>
  <div class="actions"><a class="btn" href="upload.html">＋ Upload Komik</a><a class="btn secondary" href="login.html">Login / Register</a><button class="btn danger" data-logout>Logout</button></div>
</div>
</div></main>
<nav class="bottom-nav" data-bottom-nav></nav>
<div class="toast"></div>
<script src="js/navigation.js"></script>
<script src="js/main.js"></script>
<script src="js/profile.js"></script><script src="js/auth.js"></script>
</body></html>
