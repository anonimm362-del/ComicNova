<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a10">
<title>Forgot Password • ComicNova</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="index.html" aria-label="ComicNova Home">
      <span class="brand-wordmark" aria-label="ComicNova"><span class="brand-comic">Comic</span><span class="brand-nova">Nova</span></span>
    </a>
    <form class="search" action="search.html">
      <input name="q" data-search placeholder="Cari judul manga, manhwa..." aria-label="Cari">
      <button type="submit" aria-label="Cari"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 5 5"></path></svg></button>
    </form>
    <a class="icon-btn" href="profile.html" aria-label="Profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </a>
  </div>
</header>
<main class="page"><div class="container">
<div class="form-wrap"><div class="panel auth-card">
  <div class="eyebrow">ACCOUNT RECOVERY</div><h1>Reset password.</h1><p style="color:var(--muted)">Versi demo frontend: masukkan email untuk mensimulasikan pengiriman link reset.</p>
  <form onsubmit="event.preventDefault();toast('Link reset demo berhasil dikirim');">
    <div class="form-group"><label>Email</label><input type="email" required placeholder="nama@email.com"></div><button class="btn" style="width:100%">Kirim Link Reset</button>
  </form>
  <div class="auth-links"><a href="login.html">← Kembali ke Login</a></div>
</div></div>
</div></main>

<div class="toast"></div>
<script src="js/navigation.js"></script>
<script src="js/main.js"></script>

</body></html>
